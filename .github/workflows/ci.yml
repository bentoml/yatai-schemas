name: CI

on:
  push:
    branches: [ main ]
    tags: [ v* ] #trigger on tags start with v, eg v1.0.0
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      golang: ${{ steps.filter.outputs.golang }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v2
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: 'main'
          filters: |
            golang:
              - "modelschemas/**"
              - "schemasv1/**"

  golint:
    runs-on: ubuntu-latest

    needs:
      - diff

    if: ${{ (github.event_name == 'pull_request' && needs.diff.outputs.golang == 'true') || github.event_name == 'push' }}

    steps:
      - uses: actions/setup-go@v2
        with:
          go-version: '1.26.10' # The Go version to download (if necessary) and use.

      - uses: actions/checkout@v2

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: 'v2.15.0'
          only-new-issues: true

concurrency:
  group: yatai${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

